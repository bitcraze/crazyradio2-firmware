[project]
name = "crazyradio2-firmware"
version = "0.1.0"
description = "Crazyradio 2.0 firmware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rust-just",
    "fzf-bin",
    "west",
    # CMake 4.4 rejects the unquoted empty-variable if() in Zephyr 4.2.0's
    # FindZephyr-sdk.cmake. 4.3 and older are fine.
    "cmake<4.4",
    "ninja",
    "pyelftools>=0.32",
]
