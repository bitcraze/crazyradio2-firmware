# Build the project and create a draft GitHub release

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Todo: add back "crazyradio2" when new protocol is reimplemented
        mode: [crazyradio2-CRPA-emulation]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: install just
      uses: extractions/setup-just@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Build
      run: |
        uv venv
        source ./.venv/bin/activate
        uv pip install .

        just --yes fetch-zephyr-sdk
        just fetch-zephyr
        just build

        cp build/zephyr/crazyradio2.uf2 ${{ matrix.mode }}-${{ github.ref_name }}.uf2

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: true
        prerelease: true
        fail_on_unmatched_files: true
        files: ${{ matrix.mode }}-${{ github.ref_name }}.uf2
